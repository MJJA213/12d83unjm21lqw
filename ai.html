<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interface</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #121212; color: #e0e0e0; display: flex; flex-direction: column; height: 100vh; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; max-width: 800px; width: 100%; margin: 0 auto; }
        .message { padding: 12px 16px; border-radius: 8px; max-width: 85%; line-height: 1.5; word-break: break-word; }
        .user { background: #2b2b2b; align-self: flex-end; color: #ffffff; }
        .assistant { background: #1e1e1e; align-self: flex-start; border: 1px solid #2a2a2a; color: #d4d4d4; }
        #input-container { padding: 20px; background: #121212; border-top: 1px solid #222; display: flex; justify-content: center; }
        #input-wrapper { display: flex; max-width: 800px; width: 100%; background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 8px; }
        textarea { flex: 1; background: transparent; border: none; color: #ffffff; resize: none; outline: none; padding: 8px; height: 24px; max-height: 120px; font-size: 14px; }
        button { background: #ffffff; color: #121212; border: none; padding: 8px 16px; border-radius: 4px; font-weight: 600; cursor: pointer; }
        button:hover { background: #e0e0e0; }
    </style>
</head>
<body>
    <div id="chat-container"></div>
    <div id="input-container">
        <div id="input-wrapper">
            <textarea id="prompt-input" placeholder="Message..." rows="1" autofocus></textarea>
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const promptInput = document.getElementById('prompt-input');
        const sendBtn = document.getElementById('send-btn');

        async function handleSubmit() {
            const text = promptInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            promptInput.value = '';
            promptInput.style.height = '24px';

            const loadingId = appendMessage('...', 'assistant');

            try {
                const res = await fetch('/api/index', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text })
                });
                const data = await res.json();
                
                document.getElementById(loadingId).innerText = data.response || data.error || 'No response';
            } catch (err) {
                document.getElementById(loadingId).innerText = 'Error: Failed to connect';
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function appendMessage(text, sender) {
            const msg = document.createElement('div');
            const id = 'msg-' + Math.random().toString(36.substr(2, 9));
            msg.id = id;
            msg.className = `message ${sender}`;
            msg.innerText = text;
            chatContainer.appendChild(msg);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return id;
        }

        sendBtn.addEventListener('click', handleSubmit);
        promptInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSubmit();
            }
        });

        promptInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight - 16) + 'px';
        });
    </script>
</body>
</html>
